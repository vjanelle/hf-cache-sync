name: Packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: make coverage
      - run: make deb
      - name: Test Debian package contents
        run: |
          mkdir /tmp/hf-package
          dpkg-deb -x dist/*.deb /tmp/hf-package
          /tmp/hf-package/usr/bin/hf-cache-sync --help
      - name: Install AppImage tooling
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
      - name: Build and test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPIMAGETOOL: /tmp/appimagetool
        run: |
          make appimage
          chmod +x dist/*.AppImage
          dist/*.AppImage --appimage-extract
          ./squashfs-root/AppRun --help
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv run --locked python -m coverage run --source=hf_cache_sync -m unittest discover -s tests
      - run: uv run --locked python -m coverage report --fail-under=80 -m
      - run: dotnet tool install --global wix --version 4.0.6
      - run: ./packaging/build-msi.ps1
      - name: Test executable
        run: ./dist/hf-cache-sync.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi
